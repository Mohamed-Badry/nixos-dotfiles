# Noctalia Dynamic Starship Theme
# Dynamically adapts to your wallpaper and Noctalia palette

palette = "noctalia"

format = "[](mauve)$os$username[](bg:surface1 fg:mauve)$directory[](fg:surface1 bg:surface0)$git_branch$git_status[](fg:surface0 bg:base)$c$elixir$elm$golang$gradle$haskell$java$julia$nodejs$nim$rust$scala$docker_context$python$nix_shell[](fg:base bg:rosewater)$time[ ](fg:rosewater)"

# Disable the blank line at the start of the prompt
add_newline = true

[username]
show_always = true
style_user = "bg:mauve fg:base bold"
style_root = "bg:mauve fg:base bold"
format = '[$user ]($style)'
disabled = false

[os]
style = "bg:mauve fg:base"
disabled = true 

[directory]
style = "bg:surface1 fg:text"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:surface0 fg:text"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:surface0 fg:text"
format = '[$all_status$ahead_behind ]($style)'

# Language Modules - Floating on the dark background
[c]
symbol = " "
style = "bg:base fg:teal"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "bg:base fg:teal"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:base fg:rosewater"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bg:base fg:mauve"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:base fg:sky"
format = '[ $symbol ($version) ]($style)'

[golang]
symbol = " "
style = "bg:base fg:sky"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:base fg:peach"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:base fg:mauve"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:base fg:peach"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:base fg:mauve"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:base fg:teal"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "bg:base fg:peach"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:base fg:peach"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:base fg:peach"
format = '[ $symbol ($version) ]($style)'

[python]
format = '[ ${symbol}${virtualenv} ]($style)'
symbol = "󰌠 "
style = "bg:base fg:peach"

[nix_shell]
symbol = " "
style = "bg:base fg:sky"
format = '[ $symbol]($style)'

[time]
disabled = false
time_format = "%I:%M %p" # 12-hour AM/PM Format
style = "bg:rosewater fg:base"
format = '[ ♥ $time ]($style)'

