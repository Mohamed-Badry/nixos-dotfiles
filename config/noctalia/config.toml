# Noctalia v5 Configuration

[shell]
font_family = "JetBrainsMono Nerd Font"
clipboard_enabled = true

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"
builtin = "Rosé Pine"

[theme.templates]
enable_builtin_templates = true
builtin_ids = [
  "btop",
  "cava",
  "gtk3",
  "gtk4",
  "helix",
  "niri",
  "qt",
  "starship",
  "wezterm",
]
enable_community_templates = true
community_ids = [
  "antigravity",
  "bat",
  "discord",
  "fastfetch",
  "heroiclauncher",
  "obs",
  "opencode",
  "vscode",
  "yazi",
  "zed",
  "zen-browser",
]

[wallpaper]
enabled = true
fill_mode = "crop"
directory = "@HOME@/Pictures/Wallpapers"

[bar.main]
position = "top"
thickness = 34
background_opacity = 0.8
radius = 12
margin_ends = 4
margin_edge = 4
padding = 6
widget_spacing = 6
scale = 0.9
capsule = true
capsule_opacity = 1.0
font_family = "JetBrainsMono Nerd Font"

start = ["launcher", "clock", "sysmon", "active_window", "media"]
center = ["workspaces"]
end = ["keyboard_layout", "tray", "notifications", "battery", "blackbartblues/audio-switcher:widget", "brightness", "network", "control_center"]

[widget.clock]
format = "{:%I:%M %p %a, %b %d}"

[widget.sysmon]
stat = "cpu_usage"
show_glyph = true
show_value = true
visualization = "none"

[widget.battery]
device = "BAT1"
display_mode = "glyph"
show_label = true
hide_when_plugged = true

[widget.tray]
drawer = true

[widget.keyboard_layout]
show_glyph = false
show_label = true

[hooks]
started = "@ASUS_AURA_SYNC@"
colors_changed = ["@ASUS_AURA_SYNC@"]
wallpaper_changed = ["@ASUS_AURA_SYNC@ \"$NOCTALIA_WALLPAPER_PATH\""]
theme_mode_changed = ["@ASUS_AURA_SYNC@"]

[plugins]
enabled = ["blackbartblues/audio-switcher"]
auto_update = true
