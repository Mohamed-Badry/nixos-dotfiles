# Noctalia v5 Configuration
config_version = 20

[shell]
font_family = "JetBrainsMono Nerd Font"
clipboard_enabled = true

[shell.panel]
transparency_mode = "soft"
wallpaper_position = "center"

[shell.screenshot]
directory = "@HOME@/Pictures/Screenshots"
filename_pattern = "%Y-%m/screenshot_%Y%m%d_%H%M%S"
remember_last_region = true

[backdrop]
blur_intensity = 0.55
tint_intensity = 0.4

[theme]
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-rainbow"
builtin = "Rosé Pine"
community_palette = "Oxocarbon"
custom_palette = "skwd-wall"

[theme.templates]
enable_builtin_templates = true
builtin_ids = [
  "btop",
  "cava",
  "gtk3",
  "gtk4",
  "helix",
  "niri",
  "qt",
  "starship",
  "wezterm",
]
enable_community_templates = true
community_ids = [
  "antigravity",
  "bat",
  "codex",
  "discord",
  "fastfetch",
  "fzf",
  "heroiclauncher",
  "mailspring",
  "obs",
  "opencode",
  "papirus-icons",
  "sioyek",
  "thunar",
  "vscode",
  "yazi",
  "zapfast",
  "zed",
  "zellij",
  "zen-browser",
]

[wallpaper]
enabled = true
fill_mode = "crop"
directory = "@HOME@/Pictures/Wallpapers"
transition = ["fade", "honeycomb", "stripes"]
transition_on_startup = false

[wallpaper.default]
path = "@HOME@/Pictures/Wallpapers/wallhaven_m9md18.webp"

[wallpaper.last]
path = "@HOME@/Pictures/Wallpapers/wallhaven_m9md18.webp"

[wallpaper.monitors.eDP-1]
path = "@HOME@/Pictures/Wallpapers/wallhaven_m9md18.webp"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
box_height = 196.0
box_width = 810.0
cx = 960.0
cy = 898.0
output = "eDP-1"
placement_height = 1080.0
placement_width = 1920.0
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
background_color = "surface_container"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_media_controls = true
show_password_reveal = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[dock]
enabled = false
background_opacity = 1.0
border = "secondary"
concave_edge_corners = false
icon_size = 31
launcher_icon = "rocket"
launcher_position = "end"
main_axis_padding = 8
margin_edge = 7
reserve_space = false
show_dots = true
show_instance_count = false
smart_auto_hide = false

[bar]
order = [ "main" ]

[bar.main]
position = "top"
thickness = 33
background_opacity = 0.68999998457729816
radius = 80
margin_ends = "5%"
margin_edge = 0
padding = 6
widget_spacing = 13
scale = 0.9
capsule = false
capsule_opacity = 0.0
capsule_padding = 9.0
border = "on_primary"
border_width = 1.5
panel_overlap = 2
font_family = "JetBrainsMono Nerd Font"

start = [ "launcher", "clock", "group:g2", "active_window", "media" ]
center = ["workspaces"]
end = [
  "group:g1",
  "keyboard_layout",
  "tray",
  "notifications",
  "battery",
  "privacy",
  "group:g3",
  "brightness",
  "network",
  "control_center",
]

[[bar.main.capsule_group]]
id = "g1"
enabled = true
accordion = false
accordion_direction = "end"
fill = "surface"
foreground = "on_tertiary"
opacity = 0.0
padding = 8.0
border_width = 1.0
members = ["network_rx", "network_tx"]

[[bar.main.capsule_group]]
id = "g2"
enabled = true
accordion = false
accordion_direction = "end"
fill = "surface_container"
opacity = 0.0
padding = 14.0
border_width = 1.0
members = ["ram", "sysmon"]

[[bar.main.capsule_group]]
id = "g3"
enabled = true
accordion = false
accordion_direction = "end"
fill = "surface_container"
opacity = 0.0
padding = 12.0
border_width = 1.0
members = ["output_volume", "input_volume"]

[widget.active_window]
enabled = false

[widget.clock]
format = "{:%I:%M %p %a, %b %d}"
capsule_padding = 12

[widget.launcher]
enabled = false

[widget.sysmon]
stat = "cpu_usage"
show_glyph = true
show_value = true
visualization = "none"

[widget.battery]
device = "BAT1"
display_mode = "glyph"
show_label = true
hide_when_plugged = false

[widget.tray]
drawer = true

[widget.keyboard_layout]
show_glyph = false
show_label = true

[widget.network]
show_label = false

[widget.privacy]
hide_inactive = true

[widget.output_volume]
type = "volume"
device = "output"

[widget.input_volume]
type = "volume"
device = "input"
hide_when_inactive = false

[hooks]
started = "@ASUS_AURA_SYNC@"
colors_changed = ["@ASUS_AURA_SYNC@"]
wallpaper_changed = ["@ASUS_AURA_SYNC@ \"$NOCTALIA_WALLPAPER_PATH\""]
theme_mode_changed = ["@ASUS_AURA_SYNC@"]

[plugins]
enabled = [
  "kenn/keybind-cheatsheet",
  "noctalia/wallhaven"
]
auto_update = "all"

[notification.filter.system]
match = "system"
bypass_dnd = true
show_toast = true

[notification.filter.asus_control]
match = "ASUS Control"
bypass_dnd = true
show_toast = true

