# Noctalia v5 Configuration

[shell]
font_family = "JetBrainsMono Nerd Font"
clipboard_enabled = true

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-rainbow"
builtin = "Rosé Pine"

[wallpaper]
enabled = true
fill_mode = "crop"
directory = "@HOME@/Pictures/Wallpapers"

[bar.main]
position = "top"
thickness = 34
background_opacity = 0.8
radius = 12
margin_ends = 4
margin_edge = 4
padding = 6
widget_spacing = 6
scale = 0.9
capsule = true
capsule_opacity = 1.0
font_family = "JetBrainsMono Nerd Font"

start = ["launcher", "clock", "sysmon", "active_window", "media"]
center = ["workspaces"]
end = ["keyboard_layout", "tray", "notifications", "battery", "blackbartblues/audio-switcher:widget", "brightness", "network", "control_center"]

[widget.clock]
format = "{:%I:%M %p %a, %b %d}"

[widget.sysmon]
cpu_usage = true
cpu_temp = true
memory_usage = true

[widget.battery]
device = "BAT1"
display_mode = "glyph"
show_label = true
hide_when_plugged = true

[widget.tray]
drawer = true

[widget.keyboard_layout]
show_icon = false
show_label = true

[hooks]
started = "@ASUS_AURA_SYNC@"
colors_changed = ["@ASUS_AURA_SYNC@"]
wallpaper_changed = ["@ASUS_AURA_SYNC@ \"$NOCTALIA_WALLPAPER_PATH\""]

[plugins]
enabled = ["blackbartblues/audio-switcher"]
auto_update = true
